<!doctype html>
<!-- Browser smoke test, run by scripts/smoke.sh. Loads the app in an iframe (index.html#debug) and checks
     instruments, key handling, focus loss, knob arrows and bad saved arp data. -->
<body style="margin:0"><iframe id="f" style="width:1200px;height:800px;border:0"></iframe>
<script>
// Bad saved arp data must not break the arpeggiator (same origin, so the iframe reads it)
localStorage.setItem('arp', JSON.stringify({ length: 0, steps: [null] }));
const out = [];
const check = (name, ok, extra = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name} ${extra}`);
const f = document.getElementById('f');
f.src = '../index.html#debug';
setTimeout(async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, errors = [];
    w.addEventListener('error', e => errors.push(e.message));
    d.getElementById('audioOverlay')?.click();
    await new Promise(r => setTimeout(r, 1000));
    const T = w.ToneLAB, S = T.state;
    check('bad saved arp data repaired', S.arp.length === 16 && S.arp.steps.every(s => s && typeof s === 'object'));
    for (const type of ['Synth','AMSynth','FMSynth','MembraneSynth','MetalSynth','MonoSynth','NoiseSynth','PluckSynth','PolySynth','DuoSynth']) {
      T.initSynth(type); await new Promise(r => setTimeout(r, 150));
      T.playNote('C4'); T.stopNote('C4');
    }
    check('all 10 instruments build and play without errors', errors.length === 0, errors.join(' | '));
    const key = (type, init) => d.dispatchEvent(new w.KeyboardEvent(type, { key: 't', bubbles: true, cancelable: true, ...init }));
    S.activeKeys.clear();
    key('keydown', { metaKey: true });
    check('Cmd+T does not play a note', !S.activeKeys.has('t'));
    key('keydown', {});
    check('plain key plays', S.activeKeys.has('t'));
    w.dispatchEvent(new w.Event('blur'));
    check('focus loss releases held keys', S.activeKeys.size === 0 && d.querySelectorAll('.key.pressed').length === 0);
    const knob = d.querySelector('#controls .control-group:not(.is-disabled) .knob-container');
    knob.focus(); const oct = S.currentOctave;
    knob.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
    check('arrow key on a knob leaves the octave alone', S.currentOctave === oct);

    // User presets through the dialog: save, edit (rename + update), save as new, delete
    const q1 = (sel) => d.querySelector(sel), dlg = d.getElementById('presetDialog'), nameIn = d.getElementById('presetName');
    const sel = d.getElementById('presetSelect'), mine = () => JSON.parse(w.localStorage.getItem('userPresets') || '{}').FMSynth || [];
    const submit = () => d.getElementById('presetForm').requestSubmit();
    const wait = () => new Promise(r => setTimeout(r, 100));
    d.getElementById('instrumentType').value = 'FMSynth'; d.getElementById('instrumentType').dispatchEvent(new w.Event('change', { bubbles: true }));
    await new Promise(r => setTimeout(r, 300));
    const q = q1('#controls [data-control="attack"]');
    q.value = 0.5; q.dispatchEvent(new w.Event('input', { bubbles: true }));
    q1('[data-preset-save]').click();
    check('SAVE opens the dialog', dlg.open && q1('[data-preset-op="delete"]').hidden);
    nameIn.value = '   '; submit(); await wait();
    check('blank name is refused', mine().length === 0 && dlg.open);
    nameIn.value = 'Mine'; submit(); await wait();
    check('save adds a user preset, loads it, closes the dialog', mine().length === 1 && mine()[0].params.attack === 0.5 && !dlg.open && sel.selectedOptions[0]?.parentElement.tagName === 'OPTGROUP');
    check('pocket preset select follows the desktop one', d.getElementById('presetSelectMobile').value === sel.value && sel.value !== '');
    check('save button is lit for a user preset', q1('[data-preset-save]').classList.contains('editing'));
    q.value = 0.2; q.dispatchEvent(new w.Event('input', { bubbles: true }));
    q1('[data-preset-save]').click();
    check('edit dialog is prefilled with delete and save-as-new', dlg.open && nameIn.value === 'Mine' && !q1('[data-preset-op="delete"]').hidden);
    nameIn.value = 'Mine2'; submit(); await wait();
    check('update renames and overwrites', mine().length === 1 && mine()[0].name === 'Mine2' && mine()[0].params.attack === 0.2);
    T.applyPreset('FMSynth', 0); T.applyPreset('FMSynth', sel.options.length - 2);
    check('user preset applies its values', parseFloat(q.value) === 0.2);
    q1('[data-preset-save]').click(); nameIn.value = 'Copy'; q1('[data-preset-op="new"]').click(); await wait();
    check('save as new keeps the old one', mine().length === 2 && mine()[1].name === 'Copy');
    q1('[data-preset-save]').click(); q1('[data-preset-op="delete"]').click();
    check('first delete click only arms', dlg.open && mine().length === 2);
    q1('[data-preset-op="delete"]').click(); await wait();
    check('second delete click deletes', mine().length === 1 && !dlg.open && !q1('[data-preset-save]').classList.contains('editing'));
    check('user presets run without errors', errors.length === 0, errors.join(' | '));
    // The ? hit area (::after) must not cover the control it sits next to (it once swallowed ARP and rack slider touches)
    d.querySelector('.view-btn[data-controls="sliders"]').click(); await wait();
    const covered = [...d.querySelectorAll('.effect-controls input[type=range]')].filter(el => {
      el.scrollIntoView({ block: 'nearest' }); const r = el.getBoundingClientRect(); return r.width > 0 && d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2) !== el; }).map(el => el.id);
    check('no help button covers an effects slider', covered.length === 0, covered.join(','));
    d.querySelector('.view-btn[data-controls="knobs"]').click();
    // Phaser, tremolo and crusher: nodes exist, knobs reach the engine, RND keeps them in range
    d.querySelector('[data-randomize]').click();
    const fxIds = ['phaserRate','phaserMix','tremoloRate','tremoloDepth','crushBits','crushMix'];
    check('new effect sliders exist and stay in range after RND', fxIds.every(id => { const el = d.getElementById(id); return el && +el.value >= +el.min && +el.value <= +el.max; }));
    check('phaser and tremolo nodes are in the chain', !!S.phaser && !!S.tremolo, 'crusher ' + !!S.crusher);
    T.setEffect('tremoloDepth', 0.8); T.setEffect('phaserMix', 0.5);
    check('effect knobs reach the engine', Math.abs(S.tremolo.depth.value - 0.8) < 0.01 && Math.abs(S.phaser.wet.value - 0.5) < 0.01);
    T.setArp(false);
  } catch (e) { out.push('FAIL exception ' + e.message); }
  fetch('/__result?' + encodeURIComponent(out.join('\n')));
}, 1500);
</script>
