<!doctype html>
<!-- Browser smoke test, run by scripts/smoke.sh. Loads the app in an iframe (index.html#debug) and checks
     instruments, key handling, focus loss, knob arrows and bad saved arp data. -->
<body style="margin:0"><iframe id="f" style="width:1200px;height:800px;border:0"></iframe>
<script>
// Bad saved arp data must not break the arpeggiator (same origin, so the iframe reads it)
localStorage.setItem('arp', JSON.stringify({ length: 0, steps: [null] }));
const out = [];
const check = (name, ok, extra = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name} ${extra}`);
const f = document.getElementById('f');
f.src = '../index.html#debug';
setTimeout(async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, errors = [];
    w.addEventListener('error', e => errors.push(e.message));
    d.getElementById('audioOverlay')?.click();
    await new Promise(r => setTimeout(r, 1000));
    const T = w.ToneLAB, S = T.state;
    check('analog is the default theme', d.documentElement.dataset.theme === 'analog');
    check('bad saved arp data repaired', S.arp.length === 16 && S.arp.steps.every(s => s && typeof s === 'object'));
    for (const type of ['FMSynth','MembraneSynth','MetalSynth','MonoSynth','NoiseSynth','PluckSynth','PolySynth']) {
      T.initSynth(type); await new Promise(r => setTimeout(r, 150));
      T.playNote('C4'); T.stopNote('C4');
    }
    check('all 7 instruments build and play without errors', errors.length === 0, errors.join(' | '));
    const key = (type, init) => d.dispatchEvent(new w.KeyboardEvent(type, { key: 't', bubbles: true, cancelable: true, ...init }));
    S.activeKeys.clear();
    key('keydown', { metaKey: true });
    check('Cmd+T does not play a note', !S.activeKeys.has('t'));
    key('keydown', {});
    check('plain key plays', S.activeKeys.has('t'));
    w.dispatchEvent(new w.Event('blur'));
    check('focus loss releases held keys', S.activeKeys.size === 0 && d.querySelectorAll('.key.pressed').length === 0);
    const knob = d.querySelector('#controls .control-group:not(.is-disabled) .knob-container');
    knob.focus(); const oct = S.currentOctave;
    knob.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
    check('arrow key on a knob leaves the octave alone', S.currentOctave === oct);
    // Selects are pickers: pick a preset through the popup, then the keys still play
    const presetBtn = d.querySelector('[data-picker-for="presetSelect"]');
    check('every select has a picker', [...d.querySelectorAll('select:not(.wave-select)')].every(s => s.hidden && d.querySelector(`[data-picker-for="${s.id}"]`)));
    presetBtn.click();
    d.querySelector('.picker-list:not([hidden]) .wave-picker-option[data-value="1"]').click();
    check('picker sets the preset and shows its name', d.getElementById('presetSelect').value === '1' && presetBtn.textContent === d.getElementById('presetSelect').selectedOptions[0].textContent);
    key('keydown', {});
    check('note key plays after picking a preset', S.activeKeys.has('t'));
    w.dispatchEvent(new w.Event('blur'));
    d.getElementById('keyboardLayout').value = 'azerty';
    check('picker follows a value set by code', d.querySelector('[data-picker-for="keyboardLayout"]').textContent === 'AZERTY');
    d.getElementById('keyboardLayout').value = 'qwerty';
    d.querySelector('[data-picker-for="arpMode"]').click();
    const arpList = d.querySelector('.picker-list:not([hidden])');
    check('arp pattern list has no scrollbar', arpList && arpList.scrollWidth <= arpList.clientWidth && arpList.scrollHeight <= arpList.clientHeight, arpList && `${arpList.scrollWidth}/${arpList.clientWidth}`);
    d.body.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true }));

    // User presets through the dialog: save, edit (rename + update), save as new, delete
    const q1 = (sel) => d.querySelector(sel), dlg = d.getElementById('presetDialog'), nameIn = d.getElementById('presetName');
    const sel = d.getElementById('presetSelect'), mine = () => JSON.parse(w.localStorage.getItem('userPresets') || '{}').FMSynth || [];
    const submit = () => d.getElementById('presetForm').requestSubmit();
    const wait = () => new Promise(r => setTimeout(r, 100));
    d.getElementById('instrumentType').value = 'FMSynth'; d.getElementById('instrumentType').dispatchEvent(new w.Event('change', { bubbles: true }));
    await new Promise(r => setTimeout(r, 300));
    const q = q1('#controls [data-control="attack"]');
    q.value = 0.5; q.dispatchEvent(new w.Event('input', { bubbles: true }));
    q1('[data-preset-save]').click();
    check('SAVE opens the dialog', dlg.open && q1('[data-preset-op="delete"]').hidden);
    nameIn.value = '   '; submit(); await wait();
    check('blank name is refused', mine().length === 0 && dlg.open);
    nameIn.value = 'Mine'; submit(); await wait();
    check('save adds a user preset, loads it, closes the dialog', mine().length === 1 && mine()[0].params.attack === 0.5 && !dlg.open && sel.selectedOptions[0]?.parentElement.tagName === 'OPTGROUP');
    check('pocket preset select follows the desktop one', d.getElementById('presetSelectMobile').value === sel.value && sel.value !== '');
    check('save button is lit for a user preset', q1('[data-preset-save]').classList.contains('editing'));
    q.value = 0.2; q.dispatchEvent(new w.Event('input', { bubbles: true }));
    q1('[data-preset-save]').click();
    check('edit dialog is prefilled with delete and save-as-new', dlg.open && nameIn.value === 'Mine' && !q1('[data-preset-op="delete"]').hidden);
    nameIn.value = 'Mine2'; submit(); await wait();
    check('update renames and overwrites', mine().length === 1 && mine()[0].name === 'Mine2' && mine()[0].params.attack === 0.2);
    T.applyPreset('FMSynth', 0); T.applyPreset('FMSynth', sel.options.length - 2);
    check('user preset applies its values', parseFloat(q.value) === 0.2);
    q1('[data-preset-save]').click(); nameIn.value = 'Copy'; q1('[data-preset-op="new"]').click(); await wait();
    check('save as new keeps the old one', mine().length === 2 && mine()[1].name === 'Copy');
    q1('[data-preset-save]').click(); q1('[data-preset-op="delete"]').click();
    check('first delete click only arms', dlg.open && mine().length === 2);
    q1('[data-preset-op="delete"]').click(); await wait();
    check('second delete click deletes', mine().length === 1 && !dlg.open && !q1('[data-preset-save]').classList.contains('editing'));
    check('user presets run without errors', errors.length === 0, errors.join(' | '));
    // The ? hit area (::after) must not cover the control it sits next to (it once swallowed ARP and rack slider touches)
    d.querySelector('.view-btn[data-controls="sliders"]').click(); await wait();
    const covered = [...d.querySelectorAll('.effect-controls input[type=range]')].filter(el => {
      el.scrollIntoView({ block: 'nearest' }); const r = el.getBoundingClientRect(); return r.width > 0 && d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2) !== el; }).map(el => el.id);
    check('no help button covers an effects slider', covered.length === 0, covered.join(','));
    d.querySelector('.view-btn[data-controls="knobs"]').click();
    // Phaser, tremolo and crusher: nodes exist, knobs reach the engine, RND keeps them in range
    d.querySelector('[data-randomize]').click();
    const fxIds = ['phaserRate','phaserMix','tremoloRate','tremoloDepth','crushBits','crushMix'];
    check('new effect sliders exist and stay in range after RND', fxIds.every(id => { const el = d.getElementById(id); return el && +el.value >= +el.min && +el.value <= +el.max; }));
    check('phaser and tremolo nodes are in the chain', !!S.phaser && !!S.tremolo, 'crusher ' + !!S.crusher);
    T.setEffect('tremoloDepth', 0.8); T.setEffect('phaserMix', 0.5);
    check('effect knobs reach the engine', Math.abs(S.tremolo.depth.value - 0.8) < 0.01 && Math.abs(S.phaser.wet.value - 0.5) < 0.01);
    // Every set title carries a section ? with its hint
    const titles = [...d.querySelectorAll('.control-set-title')].filter(t => !t.closest('.arp-set'));
    const bare = titles.filter(t => { const b = t.querySelector('.set-help'); return !b || !d.getElementById(b.getAttribute('aria-controls')); }).map(t => t.textContent.trim());
    check('every section has a hint', bare.length === 0, bare.join(','));
    check('the Effects box has a hint', !!d.querySelector('.panel-title .set-help[aria-controls="setHint_effects"]') && !!d.getElementById('setHint_effects'));
    // Every visible ? is tappable: nothing (a wave picker once) sits on top of it
    const hidden = [...d.querySelectorAll('.help-btn')].filter(b => b.offsetParent && b.getBoundingClientRect().width > 0).filter(b => {
      b.scrollIntoView({ block: 'nearest' }); const r = b.getBoundingClientRect(); const e = d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      b._by = e && (e.tagName + '.' + [...e.classList].join('.') + (e.id ? '#' + e.id : ''));
      return e && !b.contains(e) && !e.contains(b) && r.top >= 0 && r.bottom <= w.innerHeight; }).map(b => b.getAttribute('aria-label') + ' under ' + b._by);
    check('no help button is covered', hidden.length === 0, hidden.join(' | '));
    T.setArp(false);

    // Init: every knob back to its default, every effect dry, the volume untouched, a note still plays
    T.initSynth('MonoSynth'); await wait();
    d.querySelector('[data-randomize]').click();
    const vol = d.getElementById('masterVolume').value;
    d.querySelector('[data-init]').click();
    const GATE = { attack: 0, decay: 0, sustain: 1, release: 0, filterAttack: 0, filterDecay: 0, filterSustain: 1, filterRelease: 0 };
    const knobs = [...d.querySelectorAll('#controls input[type=range][data-control]')];
    const offDefault = knobs.filter(el => +el.value !== (GATE[el.dataset.control] ?? +el.dataset.defaultValue)).map(el => el.dataset.control);
    const KEEP = { filterFreq: 10000, distortion: 0, crushBits: 10, crushMix: 1 };
    const wet = [...d.querySelectorAll('.effects-rack input[type=range]')].filter(el => el.id !== 'masterVolume')
      .filter(el => +el.value !== (KEEP[el.id] ?? +el.min)).map(el => el.id);
    const initErrors = errors.length; T.playNote('C4'); T.stopNote('C4');
    check('Init: knobs at default, envelopes a gate, effects at minimum (Tone open, Crusher clean), volume kept', !offDefault.length && !wet.length && d.getElementById('masterVolume').value === vol, `off ${offDefault} wet ${wet}`);
    check('Init plays without errors', errors.length === initErrors);
    T.initSynth('FMSynth'); await wait(); d.querySelector('[data-randomize]').click(); d.querySelector('[data-init]').click();
    const modA = d.querySelector('#controls [data-control="modAttack"]'), modR = d.querySelector('#controls [data-control="modRelease"]');
    check('Init sets the FM Mod Envelope to a gate (A 0, R 0)', +modA.value === 0 && +modR.value === 0, `${modA.value} / ${modR.value}`);
    T.initSynth('MetalSynth'); await wait(); d.querySelector('[data-init]').click();
    const metalDecay = d.querySelector('#controls [data-control="decay"]');
    check('Init keeps an envelope without Sustain audible (Metal decay at its default)', +metalDecay.value === +metalDecay.dataset.defaultValue && +metalDecay.value > 0, metalDecay.value);

    // Envelope playhead: A lights while the attack runs, R after the key is up
    T.initSynth('MonoSynth'); await wait();
    const envSet = d.querySelector('#controls .control-set[aria-label="Envelope"]');
    const atk = envSet.querySelector('[data-control="attack"]'); atk.value = 1; atk.dispatchEvent(new w.Event('input', { bubbles: true }));
    const live = () => envSet.querySelector('.env-stage.is-live')?.textContent;
    T.playNote('C4'); await wait();
    const during = live();
    T.stopNote('C4'); await wait();
    check('envelope playhead follows the note (A while held, R after release)', during === 'A' && live() === 'R', `${during} then ${live()}`);
    // Released mid-attack above a low sustain: the playhead jumps to R, the dot on the curve at the sustain level
    const sus = envSet.querySelector('[data-control="sustain"]'); sus.value = 0.1; sus.dispatchEvent(new w.Event('input', { bubbles: true }));
    atk.value = 2; atk.dispatchEvent(new w.Event('input', { bubbles: true }));
    T.playNote('C4'); await new Promise(r => setTimeout(r, 1000)); T.stopNote('C4');
    const sDot = envSet.querySelectorAll('.env-dot')[2].getAttribute('d'), dot = envSet.querySelector('.env-head').getAttribute('d');
    const xy = (dd) => (dd.match(/^M([\d.]+) ([\d.]+)h0/) || []).slice(1).map(Number);
    const [sx, sy] = xy(sDot), [hx, hy] = xy(dot);
    check('early release jumps to R with the dot on the curve at the sustain level', live() === 'R' && Math.abs(sx - hx) < 1 && Math.abs(sy - hy) < 0.5, `S end ${sDot} dot ${dot}`);
    sus.value = 0.9; sus.dispatchEvent(new w.Event('input', { bubbles: true }));

    // A held note rests in S: the animation stops (no frames), and the release starts it again
    atk.value = 0; atk.dispatchEvent(new w.Event('input', { bubbles: true }));
    T.playNote('C4'); await new Promise(r => setTimeout(r, 1800)); // past every preview's A + D + 1 s plateau
    let frames = 0; const rafWas = w.requestAnimationFrame; w.requestAnimationFrame = (cb) => { if (cb.name === 'frame') frames++; return rafWas.call(w, cb); }; // the scope animates too
    atk.dispatchEvent(new w.Event('input', { bubbles: true })); // a knob move draws once (rAF barely runs in headless)
    const restFrames = frames, restStage = live();
    T.stopNote('C4');
    check('a held note rests in S without animating, release resumes', restFrames === 0 && restStage === 'S' && live() === 'R' && frames > 0,
      `resting: ${restFrames} frames on ${restStage}; after release: ${frames} frames on ${live()}`);
    w.requestAnimationFrame = rafWas;

    // Learn mode: off by default, starts on the Mono Synth from zero, one step per knob, RND never counts
    const step = () => d.getElementById('learnStep').textContent;
    const setOf = (name) => d.querySelector(`#controls .control-set[aria-label="${name}"]`);
    const ctl = (id) => d.querySelector(`#controls [data-control="${id}"]`) || d.getElementById(id);
    const put = (id, v) => { const el = ctl(id); el.value = v; el.dispatchEvent(new w.Event(el.tagName === 'SELECT' ? 'change' : 'input', { bubbles: true })); };
    check('learn is off by default', d.getElementById('learnBar').hidden);
    T.initSynth('FMSynth'); await wait();
    d.querySelector('[data-learn]').click(); await wait();
    const steps = await T.learnSteps;
    check('learn switches to the Mono Synth and lights step 1', S.currentInstrumentType === 'MonoSynth' && step().startsWith(`Learn 1/${steps.length}`)
      && setOf('Oscillator').classList.contains('is-next') && setOf('Filter').classList.contains('is-later'), step());
    check('learn starts from zero, sound kept audible', ctl('oscType').value === 'sine' && +ctl('attack').value === 0 && +ctl('reverb').value === 0
      && +ctl('sustain').value === 1 && +ctl('filterCutoff').value === 20000 && +ctl('crushMix').value === 1 && +d.getElementById('masterVolume').value > 0,
      `sus ${ctl('sustain').value} cut ${ctl('filterCutoff').value}`);
    const WIN = { spread: 50, attack: 0.8, sustain: 0.8, decay: 0.8, release: 2, filterCutoff: 2000, filterQ: 10, filterAttack: 0.5, filterDecay: 0.8,
      filterSustain: 0.8, filterRelease: 2, reverb: 0.5, reverbSize: 6, delayMix: 0.5, delayTime: 0.5, delayFeedback: 0.7, filterFreq: 5000,
      distortion: 0.5, chorusMix: 0.6, chorusRate: 5, phaserMix: 0.6, phaserRate: 4, tremoloDepth: 0.8, tremoloRate: 10, crushBits: 4, crushMix: 0.8 };
    let stuck = '';
    const next = d.getElementById('learnSkip');
    for (const [i, s] of steps.entries()) {
      if (!step().startsWith(`Learn ${i + 1}/`)) { stuck = `step ${i + 1} (${s.ctl}) not reached: ${step()}`; break; }
      if (s.ctl === 'sustain' && +ctl('sustain').value !== 0) { stuck = 'sustain did not drop to 0 at its step'; break; }
      if (s.ctl === 'delayMix' && +ctl('reverb').value !== 0) { stuck = 'reverb still on during the delay steps (not solo)'; break; }
      if (s.ctl === 'filterAttack' && !(+ctl('attack').value <= 0.02 && +ctl('filterCutoff').value <= 400 && d.getElementById('learnTask').textContent.includes('Learn set'))) {
        stuck = `filter envelope not set up to be heard: attack ${ctl('attack').value}, cutoff ${ctl('filterCutoff').value}`; break; }
      if (i === 3) { d.querySelector('[data-randomize]').click(); put('attack', 0.1); if (next.textContent !== 'Skip') { stuck = 'RND or another knob counted'; break; } }
      if (s.ctl === 'oscType') ['square', 'sawtooth', 'triangle'].forEach(v => put('oscType', v));
      else { if (s.ctl === 'spread') put('oscType', 'fatsawtooth'); put(s.ctl, WIN[s.ctl]); }
      if (!next.textContent.startsWith('Next') || !step().startsWith(`Learn ${i + 1}/`)) { stuck = `step ${i + 1} (${s.ctl}): goal not shown, or moved on by itself`; break; }
      if (s.ctl === 'reverbSize' && +ctl('reverb').value !== 0.5) { stuck = 'reverb went off before Next'; break; }
      if (i === 0 && w.getComputedStyle(next).animationName !== 'learn-next-pulse') { stuck = 'Next does not pulse when the goal is reached'; break; }
      next.click();
    }
    check(`every knob step completes in order (${steps.length} steps)`, !stuck && step() === 'Learn' && !d.querySelector('.is-next, .is-later, .learn-focus'), stuck || step());
    check('effects play solo, then all come back at the end', +ctl('reverb').value === 0.5 && +ctl('delayMix').value === 0.5 && +ctl('chorusMix').value === 0.6,
      `reverb ${ctl('reverb').value} delay ${ctl('delayMix').value}`);
    d.querySelector('[data-learn]').click();
    check('learn off hides the bar', d.getElementById('learnBar').hidden);
  } catch (e) { out.push('FAIL exception ' + e.message); }
  fetch('/__result?' + encodeURIComponent(out.join('\n')));
}, 1500);
</script>
